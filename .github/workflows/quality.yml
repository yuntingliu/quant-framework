name: quality

on:
  pull_request:
  push:
    branches: [main, dongfang, dev_liu]

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Python
        run: python -m pip install -e ".[dev,dashboard]"
      - name: Python quality
        shell: bash
        run: |
          python -m pytest tests -q
          python scripts/check_facade_imports.py
          python -m ruff check alphalab dashboard/backend tests scripts
          python scripts/check_repository_hygiene.py
          python -m compileall -q alphalab dashboard/backend scripts
          git diff --check
          git diff --exit-code

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json
      - name: Frontend quality
        run: |
          npm --prefix dashboard/frontend ci
          npm --prefix dashboard/frontend audit
          npm --prefix dashboard/frontend audit --omit=dev
          npm --prefix dashboard/frontend test
          npm --prefix dashboard/frontend run lint
          npm --prefix dashboard/frontend run build

  local-agent:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: python -m pip install -e ".[dev,dashboard]"
      - run: python scripts/build_conexus_runtime.py
      - run: npm --prefix integrations/conexus/core test
      - run: npm --prefix runtime/conexus audit --omit=dev
      - run: python -m pytest tests/dashboard/test_local_agent_integration.py tests/contracts/test_conexus_distribution.py -q
      - run: git diff --exit-code
