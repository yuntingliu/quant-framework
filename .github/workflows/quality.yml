name: quality

on:
  pull_request:
  push:
    branches: [main, dongfang, dev_liu]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Python
        run: python -m pip install -e ".[dev,dashboard]"
      - name: Python quality
        run: |
          python -m pytest tests -q
          python scripts/check_facade_imports.py
          python -m ruff check alphalab dashboard/backend tests scripts
          python scripts/check_repository_hygiene.py
          python -m compileall -q alphalab dashboard/backend scripts
          git diff --check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json
      - name: Frontend quality
        run: |
          npm --prefix dashboard/frontend ci
          npm --prefix dashboard/frontend audit --omit=dev --audit-level=high
          npm --prefix dashboard/frontend test
          npm --prefix dashboard/frontend run lint
          npm --prefix dashboard/frontend run build
