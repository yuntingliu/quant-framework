name: quality

on:
  pull_request:
  push:
    branches: [main, dongfang, dev_liu, deploy/local]

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Python
        run: python -m pip install -e ".[dev,app]"
      - name: Python quality
        shell: bash
        run: |
          python -m pytest tests -q
          python scripts/check_facade_imports.py
          python scripts/check_conexus_docs.py
          python -m ruff check alphalab apps/api tests scripts
          python scripts/check_repository_hygiene.py
          python -m compileall -q alphalab apps/api scripts
          git diff --check
          git diff --exit-code

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Frontend quality
        run: |
          npm --prefix apps/desktop ci
          # Audits gate at high while GHSA-g3hv-75wg-m249 (minimatch moderate
          # DoS, <11.0.1) has no safe remediation here: the patched minimatch
          # drops its callable CommonJS export, and electron-builder still
          # reaches glob@7, which calls minimatch as a function. Forcing it
          # tree-wide clears the audit but breaks desktop packaging, which these
          # jobs never exercise. High and critical advisories still fail.
          npm --prefix apps/desktop audit --audit-level=high
          npm --prefix apps/desktop audit --omit=dev --audit-level=high
          npm --prefix apps/desktop test
          npm --prefix apps/desktop run lint
          npm --prefix apps/desktop run build:desktop

  local-agent:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: python -m pip install -e ".[dev,app]"
      - run: python scripts/build_conexus_runtime.py
      - run: python scripts/check_conexus_runtime.py
      - run: npm --prefix build/conexus audit --omit=dev
      - run: python -m pytest tests/api/test_local_agent_integration.py tests/contracts/test_conexus_distribution.py -q
      - name: Minimal Agent demo
        run: node examples/conexus/minimal-agent/main.mjs
      - name: Financial integration demo
        run: node examples/conexus/financial-integration/main.mjs
      - name: Minimal Agent lifecycle tests
        run: node --test "examples/conexus/minimal-agent/test/*.test.mjs"
      - name: Financial integration tests
        run: node --test "examples/conexus/financial-integration/test/*.test.mjs"
      - run: git diff --exit-code
