name: value
description: Generic value template using fundamental fields supplied by adapters.
universe:
  pool: all
  min_price: 3.0
  min_history_days: 120
  min_average_amount: 10000000
selection:
  n_stocks: 10
  min_factor_coverage: 0.5
portfolio:
  max_weight: 0.10
  rebalance_freq: monthly
execution:
  cost_bps: 10
  slippage_bps: 5
  impact_bps: 10
  execution_price: next_open
  portfolio_value: 1000000
  max_participation_rate: 0.10
factors:
  - name: ep
    source: fundamental
    direction: long
    weight: 0.45
  - name: bp
    source: fundamental
    direction: long
    weight: 0.35
  - name: leverage
    source: fundamental
    direction: short
    weight: 0.20

