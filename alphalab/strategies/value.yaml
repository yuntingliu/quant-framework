name: value
description: Generic value template using fundamental fields supplied by adapters.
universe:
  pool: all
selection:
  n_stocks: 10
  min_factor_coverage: 0.5
portfolio:
  max_weight: 0.10
  rebalance_freq: monthly
factors:
  - name: ep
    source: fundamental
    direction: long
    weight: 0.45
  - name: bp
    source: fundamental
    direction: long
    weight: 0.35
  - name: leverage
    source: fundamental
    direction: short
    weight: 0.20

