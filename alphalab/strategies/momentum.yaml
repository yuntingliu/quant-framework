name: momentum
description: Generic price momentum template.
universe:
  pool: all
selection:
  n_stocks: 10
  min_factor_coverage: 0.5
portfolio:
  max_weight: 0.10
  rebalance_freq: monthly
factors:
  - name: momentum_20d
    source: technical
    direction: long
    weight: 0.55
  - name: momentum_60d
    source: technical
    direction: long
    weight: 0.30
  - name: volatility_20d
    source: technical
    direction: short
    weight: 0.15

