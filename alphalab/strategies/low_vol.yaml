name: low_vol
description: Generic low-volatility template.
universe:
  pool: all
selection:
  n_stocks: 10
  min_factor_coverage: 0.5
portfolio:
  max_weight: 0.10
  rebalance_freq: monthly
factors:
  - name: volatility_20d
    source: technical
    direction: short
    weight: 0.65
  - name: ma_deviation
    source: technical
    direction: long
    weight: 0.20
  - name: turnover_20d
    source: technical
    direction: long
    weight: 0.15

