name: conexus-alphalab

services:
  web:
    image: ${CONEXUS_SERVER_IMAGE}
    command: ["node", "dist/web-host.js"]
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    network_mode: host
    environment:
      NODE_ENV: production
      CONEXUS_WEB_HOST: 127.0.0.1
      CONEXUS_WEB_PORT: 3100
      CONEXUS_WEB_DIST: /app/web
      CONEXUS_PROJECT_ROOT: /data/project
      CONEXUS_WEB_TOKEN: ${CONEXUS_WEB_TOKEN}
      CONEXUS_WEB_ADMIN_AUTH: "false"
      CONEXUS_WEB_ALLOWED_MODELS: ${CONEXUS_WEB_ALLOWED_MODELS:-openrouter/auto}
      CONEXUS_WEB_MAX_CONCURRENT_AGENT_RUNS: 2
      CONEXUS_WEB_MAX_AGENT_RUNS_PER_MINUTE: 10
      CONEXUS_WEB_MAX_AGENT_ITERATIONS: 12
      CONEXUS_WEB_MAX_MODEL_TOKENS: 4096
      CONEXUS_WEB_MAX_CONCURRENT_PUBLIC_RUNS: 2
      CONEXUS_WEB_MAX_PUBLIC_RUNS_PER_MINUTE: 30
      CONEXUS_WEB_MAX_PUBLIC_INPUT_BYTES: 262144
      CONEXUS_WEB_TRUSTED_RUNTIME: "true"
      CONEXUS_WEB_BROWSER_ALLOW_PRIVATE_NETWORK: "false"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_DEFAULT_MODEL: ${OPENROUTER_DEFAULT_MODEL:-openrouter/auto}
      OPENROUTER_TIMEOUT_MS: ${OPENROUTER_TIMEOUT_MS:-120000}
      CONEXUS_PUBLIC_APP_URL: ${CONEXUS_PUBLIC_APP_URL}
      ALPHALAB_API_ORIGIN: http://127.0.0.1:18000
    volumes:
      - ./project:/data/project
    read_only: true
    tmpfs:
      - /tmp:size=512m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
